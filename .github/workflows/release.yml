name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  guard-tag-on-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure tag points to main HEAD
        shell: bash
        run: |
          git fetch origin main --depth=1
          TAG_SHA="$(git rev-list -n 1 "$GITHUB_REF")"
          MAIN_SHA="$(git rev-parse origin/main)"
          if [ "$TAG_SHA" != "$MAIN_SHA" ]; then
            echo "Tag $GITHUB_REF_NAME não está no HEAD da main."
            echo "TAG_SHA=$TAG_SHA"
            echo "MAIN_SHA=$MAIN_SHA"
            echo "Crie a tag após o push final na main para evitar release com versão antiga."
            exit 1
          fi

  android:
    needs: guard-tag-on-main
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [demo, operacao, catalogo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Use runner Android SDK
        run: |
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          test -d "$SDK"
      - run: npm ci
      - run: node scripts/set-release-version.mjs
      - run: npm run build
        env:
          VITE_APP_MODE: ${{ matrix.mode }}
      - run: npx cap sync android
        env:
          VITE_APP_MODE: ${{ matrix.mode }}
      - run: chmod +x android/gradlew
      - run: node scripts/build-android-apk.mjs
        env:
          VITE_APP_MODE: ${{ matrix.mode }}
      - run: mv android/app/build/outputs/apk/debug/InjetBox.apk android/app/build/outputs/apk/debug/InjetBox-${{ matrix.mode }}.apk
      - uses: actions/upload-artifact@v4
        with:
          name: injetbox-android-${{ matrix.mode }}
          path: android/app/build/outputs/apk/debug/InjetBox-${{ matrix.mode }}.apk

  desktop:
    needs: guard-tag-on-main
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [demo, operacao, catalogo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/set-release-version.mjs
      - run: npm run desktop:build
        env:
          VITE_APP_MODE: ${{ matrix.mode }}
      - shell: pwsh
        run: |
          $exe = Get-ChildItem release -Filter *.exe | Select-Object -First 1
          if (-not $exe) { throw "Arquivo .exe não encontrado" }
          $newName = "$($exe.BaseName)-${{ matrix.mode }}.exe"
          Rename-Item -Path $exe.FullName -NewName $newName
      - uses: actions/upload-artifact@v4
        with:
          name: injetbox-windows-${{ matrix.mode }}
          path: release/*-${{ matrix.mode }}.exe

  linux:
    needs: guard-tag-on-main
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        mode: [demo, operacao, catalogo]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Linux packagers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends fakeroot dpkg libfuse2 fuse
      - run: npm ci
      - run: node scripts/set-release-version.mjs
      - name: Build web app
        run: npx vite build --base ./
        env:
          VITE_APP_MODE: ${{ matrix.mode }}
      - name: Package Linux AppImage and deb
        run: npx electron-builder --linux AppImage deb --publish never
        env:
          VITE_APP_MODE: ${{ matrix.mode }}
          USE_HARD_LINKS: false
          APPIMAGE_EXTRACT_AND_RUN: 1
      - name: Stamp Linux artifacts
        run: node scripts/stamp-linux-build.mjs
        env:
          VITE_APP_MODE: ${{ matrix.mode }}
      - name: Debug Linux artifacts
        if: failure()
        run: ls -la release || true
      - uses: actions/upload-artifact@v4
        with:
          name: injetbox-linux-${{ matrix.mode }}
          path: |
            release/*.AppImage
            release/*.deb

  publish:
    needs: [android, desktop, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        id: publish
        continue-on-error: true
        with:
          files: |
            injetbox-android-*/InjetBox-*.apk
            injetbox-windows-*/*.exe
            injetbox-linux-*/*
          generate_release_notes: true
          name: InjetBox ${{ github.ref_name }}
          fail_on_unmatched_files: true
          overwrite_files: true
      - if: steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            injetbox-android-*/InjetBox-*.apk
            injetbox-windows-*/*.exe
            injetbox-linux-*/*
          generate_release_notes: true
          name: InjetBox ${{ github.ref_name }}
          fail_on_unmatched_files: true
          overwrite_files: true
