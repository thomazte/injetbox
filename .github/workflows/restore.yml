name: Restore check

on:
  workflow_dispatch:
  push:
    paths:
      - supabase/schema.sql
      - .env.example
      - .github/workflows/restore.yml

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Conferir arquivos de restore
        run: |
          test -f LICENSE
          test -f .env.example
          test -f supabase/schema.sql
          test -f RESTORE.md
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
