name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
      - run: npm ci
      - run: node scripts/set-release-version.mjs
      - run: npm run build
      - run: npx cap sync android
      - run: chmod +x android/gradlew
      - run: node scripts/build-android-apk.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: injetbox-android
          path: android/app/build/outputs/apk/debug/InjetBox.apk

  desktop:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/set-release-version.mjs
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: injetbox-windows
          path: release/*.exe

  publish:
    needs: [android, desktop]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        id: publish
        continue-on-error: true
        with:
          files: |
            injetbox-android/InjetBox.apk
            injetbox-windows/*.exe
          generate_release_notes: true
          name: InjetBox ${{ github.ref_name }}
          fail_on_unmatched_files: true
          overwrite_files: true
      - if: steps.publish.outcome == 'failure'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            injetbox-android/InjetBox.apk
            injetbox-windows/*.exe
          generate_release_notes: true
          name: InjetBox ${{ github.ref_name }}
          fail_on_unmatched_files: true
          overwrite_files: true
